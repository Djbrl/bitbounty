# Fly.io: the API server (apps/server), built from the root Dockerfile.
# Secrets (GitHub App, Bitnob, Anthropic, DATABASE_URL...) are set with `fly secrets set`, never here.
app = "bitbounty-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  # Always on: GitHub and Bitnob webhooks and the claim timers can't wait for a cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
